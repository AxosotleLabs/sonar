pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'sonar'

def platforms = [
        'forge-1.20.1', 'fabric-1.20.1',
        'neoforge-1.21.1', 'fabric-1.21.1',
        'neoforge-1.21.11', 'fabric-1.21.11',
        'neoforge-26.1.2', 'fabric-26.1.2',
        'neoforge-26.2', 'fabric-26.2',
        'neoforge-26.3', 'fabric-26.3',
]

platforms.each { name ->
    if (file("platforms/$name").isDirectory()) {
        include name
        project(":$name").projectDir = file("platforms/$name")
    }
}
