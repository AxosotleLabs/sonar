apply plugin: 'java'

version = rootProject.mod_version
group = rootProject.mod_group_id

base {
    archivesName = "${rootProject.mod_id}-${project.loader}-${project.minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(project.java_version)
}

sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')
project.shared_sources.split(',').each { dir ->
    if (!dir.isBlank()) sourceSets.main.java.srcDir rootProject.file("mc/${dir.trim()}")
}

def metadataProps = [
        mod_id                 : rootProject.mod_id,
        mod_name               : rootProject.mod_name,
        mod_version            : rootProject.mod_version,
        mod_license            : rootProject.mod_license,
        mod_authors            : rootProject.mod_authors,
        mod_description        : rootProject.mod_description,
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        loader_version_range   : project.loader_version_range,
        java_version           : project.java_version,
]

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties metadataProps
    expand metadataProps
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

def collectJar = tasks.register('collectJar', Copy) {
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into rootProject.layout.projectDirectory.dir('dist')
}
tasks.named('build') { finalizedBy collectJar }
