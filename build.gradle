plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4' apply false
    id 'net.fabricmc.fabric-loom' version '1.19.4' apply false
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds the mod for every Minecraft version and loader into dist/.'
    dependsOn subprojects.collect { "${it.path}:build" }
}
